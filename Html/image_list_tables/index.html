<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images Lists tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img width="1000" src="spiderman.jpeg" alt="">
    <br>
    <thead>Avenger details</thead>
    <table border="1">
        <tr>
            <td colspan="2">Avengers</td>
        </tr>
        <tr>
            <td rowspan="2"> Ironman</td>
            <td rowspan="2">Thor</td>
        </tr>
    </table>
    <tfoot>END</tfoot>

    <ul type="square">
        <li>Ironman</li>
        <li>Thor</li>
        <li>Captain America</li>
    </ul>

    <ol>
        <li>Ironman</li>
        <li>Thor</li>
        <li>Captain America</li>
    </ol>


</body>
</html>
